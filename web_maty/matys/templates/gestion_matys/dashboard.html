<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Matys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .panel-navbar {
      background: #0f172a;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-navbar .brand {
      color: #fbbf24;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .panel-navbar .user-info { color: #94a3b8; font-size: 0.8rem; }
    .btn-logout {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.8rem;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; }
    .construction-card {
      max-width: 480px;
      margin: 5rem auto;
      text-align: center;
      padding: 3rem 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .construction-icon { font-size: 3.5rem; color: #fbbf24; margin-bottom: 1rem; }
    .construction-card h2 { font-size: 1.3rem; font-weight: 700; color: #0f172a; }
    .construction-card p { color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>

  <nav class="panel-navbar">
    <span class="brand"><i class="bi bi-grid-1x2-fill me-2"></i>Panel Matys</span>
    <div class="d-flex align-items-center gap-3">
      <span class="user-info"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</span>
      <a href="{% url 'gestion_logout' %}" class="btn-logout">
        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
      </a>
    </div>
  </nav>

  <main class="container">
    <div class="construction-card">
      <div class="construction-icon"><i class="bi bi-hammer"></i></div>
      <h2>Panel en construcción</h2>
      <p class="mt-2">Esta sección está siendo desarrollada.<br>Pronto podrás gestionar el contenido del sitio desde aquí.</p>
    </div>
  </main>

</body>
</html>
