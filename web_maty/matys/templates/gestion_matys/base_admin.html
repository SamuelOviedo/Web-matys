<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel Matys{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens ─────────────────────────────────────────── */
    :root {
      --ink:    #0B1224;
      --navy:   #0E1F4D;
      --navy-2: #16306E;
      --yellow: #FFD60A;
      --yellow-2: #F4C400;
      --paper:  #FAF8F2;
      --bg:     #F4F1E8;
      --line:   #E6E3DA;
      --line-2: #D9D5C7;
      --mute:   #6B6A63;
      /* Bootstrap overrides */
      --bs-primary: #0E1F4D;
      --bs-body-bg: #F4F1E8;
      --bs-body-color: #0B1224;
      --bs-border-color: #E6E3DA;
      --bs-border-radius: 6px;
      --bs-border-radius-lg: 10px;
    }

    /* ── Base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      margin: 0;
    }
    .font-display { font-family: 'Playfair Display', serif; }
    .font-mono    { font-family: 'JetBrains Mono', monospace; }

    /* ── Sidebar (offcanvas base; overridden to fixed on desktop) ── */
    #appSidebar {
      width: 220px !important;
      background: var(--ink) !important;
      border-right: none !important;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      #appSidebar {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        height: 100vh !important;
        visibility: visible !important;
        transform: none !important;
        z-index: 1030;
      }
      .offcanvas-backdrop { display: none !important; }
      .main-wrapper { margin-left: 220px; }
    }

    /* Brand block */
    .sb-brand {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 18px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .sb-mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--yellow);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 15px; font-weight: 700; color: var(--ink);
      flex-shrink: 0;
    }
    .sb-product { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.2; }
    .sb-version { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.45); }

    /* Section label */
    .sb-section-label {
      font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .14em;
      color: rgba(255,255,255,.38);
      padding: 14px 10px 5px;
    }

    /* Nav item */
    .sb-nav-item {
      display: flex; align-items: center; gap: 9px;
      height: 32px; padding: 0 10px; border-radius: 8px;
      font-size: 13px; color: #D8D3C2;
      text-decoration: none;
      transition: background .12s, color .12s;
      position: relative; white-space: nowrap;
    }
    .sb-nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sb-nav-item.active {
      background: rgba(255,214,10,.14); color: #fff;
    }
    .sb-nav-item.active::after {
      content: '';
      position: absolute; right: 10px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--yellow);
    }
    .sb-nav-item i { font-size: 14px; flex-shrink: 0; }

    /* User block */
    .sb-user {
      margin-top: auto; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      display: flex; align-items: center; gap: 9px;
    }
    .sb-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(255,255,255,.65); flex-shrink: 0;
    }
    .sb-user-name { font-size: 12.5px; color: #D8D3C2; font-weight: 500; line-height: 1.2; }
    .sb-user-role {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: .10em; color: rgba(255,255,255,.38);
    }
    .sb-logout {
      margin-left: auto; color: rgba(255,255,255,.35);
      font-size: 14px; text-decoration: none;
      transition: color .12s;
    }
    .sb-logout:hover { color: #fff; }

    /* ── Topbar ────────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; height: 56px;
      background: rgba(250,248,242,.72);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center;
      padding: 0 24px; gap: 12px;
      z-index: 1020;
    }
    .topbar-menu-btn {
      width: 36px; height: 36px; border-radius: 6px;
      border: 1px solid var(--line); background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; cursor: pointer; color: var(--ink);
    }
    .topbar-breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--mute);
    }
    .topbar-breadcrumb .sep { opacity: .45; }
    .topbar-breadcrumb .current { color: var(--ink); font-weight: 500; }
    .topbar-spacer { flex: 1; }
    .topbar-search {
      width: 260px; height: 36px;
      background: #fff; border: 1px solid var(--line); border-radius: 6px;
      display: flex; align-items: center; padding: 0 10px; gap: 7px;
      color: var(--mute); font-size: 13px;
    }
    .topbar-search input {
      border: none; background: transparent; outline: none;
      font-size: 13px; color: var(--ink); flex: 1;
    }
    .topbar-search input::placeholder { color: var(--mute); }
    @media (max-width: 640px) { .topbar-search { display: none; } }
    .topbar-icon-btn {
      width: 36px; height: 36px; border-radius: 6px;
      border: 1px solid var(--line); background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; cursor: pointer; color: var(--ink);
      text-decoration: none; transition: background .12s;
    }
    .topbar-icon-btn:hover { background: var(--paper); color: var(--ink); }

    /* ── Main wrapper ──────────────────────────────────────────── */
    .main-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
    .main-content { flex: 1; }

    /* ── Page header ───────────────────────────────────────────── */
    .page-header { padding: 28px 24px 20px; }
    .page-eyebrow {
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .18em;
      color: var(--navy); margin-bottom: 6px;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 42px; font-weight: 700;
      color: var(--navy); line-height: 1.05; letter-spacing: -.01em;
      margin: 0 0 10px;
    }
    .page-lede { font-size: 13.5px; color: var(--mute); max-width: 640px; margin: 0; }
    .page-actions { display: flex; gap: 8px; align-items: center; }

    /* ── KPI strip ─────────────────────────────────────────────── */
    .kpi-strip {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 12px; padding: 0 24px 24px;
    }
    @media (max-width: 992px) { .kpi-strip { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 576px) { .kpi-strip { grid-template-columns: 1fr; } }
    .kpi-card {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 14px; display: flex; align-items: flex-start; gap: 12px;
    }
    .kpi-icon {
      width: 36px; height: 36px; border-radius: 6px;
      background: rgba(255,214,10,.20);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--navy); flex-shrink: 0;
    }
    .kpi-icon.alert { background: #FBE7E5; color: #A4322B; }
    .kpi-label {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--mute); margin-bottom: 4px;
    }
    .kpi-value {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1;
    }

    /* ── Work surface ──────────────────────────────────────────── */
    .work-surface {
      margin: 0 24px 24px;
      background: #fff; border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
    }
    .surface-toolbar {
      height: 44px; background: rgba(250,248,242,.60);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; padding: 0 16px; gap: 8px;
    }
    .surface-col-header {
      height: 32px; background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; padding: 0 16px; gap: 8px;
    }
    .col-label {
      font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .12em; color: var(--mute);
    }

    /* ── Generic admin card ────────────────────────────────────── */
    .admin-card {
      background: #fff; border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
    }
    .admin-card-header {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-card-title { font-size: 13.5px; font-weight: 600; color: var(--navy); }

    /* ── Data rows ─────────────────────────────────────────────── */
    .data-row {
      display: flex; align-items: center;
      height: 44px; padding: 0 16px;
      border-bottom: 1px solid var(--line);
      transition: background .08s; position: relative;
    }
    .data-row:last-child { border-bottom: none; }
    .data-row:hover { background: #FBF9F1; }
    .data-row:hover .row-actions { opacity: 1; }
    .row-name { font-size: 13.5px; font-weight: 500; color: var(--ink); flex: 1; }
    .row-actions { opacity: 0; transition: opacity .12s; display: flex; gap: 4px; }
    .row-icon-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: none; background: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #3A3A33; cursor: pointer;
      transition: background .12s, color .12s;
    }
    .row-icon-btn:hover { background: #EAE6D6; }
    .row-icon-btn.danger:hover { background: #FBE7E5; color: #A4322B; }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn-admin {
      height: 36px; padding: 0 14px; border-radius: 6px;
      font-size: 13.5px; font-weight: 600; border: none;
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; transition: background .15s; text-decoration: none;
    }
    .btn-admin-primary {
      background: var(--navy); color: #fff;
      box-shadow: 0 8px 18px -10px rgba(14,31,77,.55);
    }
    .btn-admin-primary:hover { background: var(--navy-2); color: #fff; }
    .btn-admin-secondary {
      background: #fff; color: var(--ink);
      border: 1px solid var(--line) !important; font-weight: 500;
    }
    .btn-admin-secondary:hover { background: var(--paper); color: var(--ink); }

    /* ── Chips ─────────────────────────────────────────────────── */
    .chip {
      display: inline-flex; align-items: center;
      height: 22px; padding: 0 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600; gap: 4px;
    }
    .chip-neutral  { background: #EFEBDC; color: #3A3A33; }
    .chip-success  { background: #E5F3EA; color: #1F6B3A; }
    .chip-warning  { background: #F1ECDB; color: #7A5B00; }
    .chip-muted    { background: #EEEAE0; color: #6B6A63; }
    .chip-accent   { background: var(--yellow); color: var(--ink); }
    .chip-navy     { background: var(--navy); color: #fff; }

    /* ── Image grid ────────────────────────────────────────────── */
    .image-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 16px; padding: 20px 24px;
    }
    @media (max-width: 992px) { .image-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 576px) { .image-grid { grid-template-columns: 1fr; } }
    .image-card {
      background: #fff; border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
    }
    .image-card img {
      width: 100%; aspect-ratio: 4/3; object-fit: cover;
      background: var(--paper); display: block;
    }
    .image-card-body { padding: 10px 12px 12px; }
    .image-card-name {
      font-size: 13px; font-weight: 600; color: var(--ink);
      margin-bottom: 5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Placeholder empty state ───────────────────────────────── */
    .empty-state {
      padding: 52px 24px; text-align: center; color: var(--mute);
    }
    .empty-state i { font-size: 2.2rem; color: var(--line-2); display: block; margin-bottom: 12px; }
    .empty-state-title { font-size: 14px; font-weight: 600; color: var(--mute); }
    .empty-state-text  { font-size: 13px; margin-top: 4px; }

    /* ── Page section wrapper ──────────────────────────────────── */
    .page-section { padding: 0 24px 24px; }

    /* ── Form controls (modal / inspector) ────────────────────── */
    .form-label-admin {
      display: block;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .10em;
      color: var(--mute); margin-bottom: 5px;
    }
    .input-admin {
      width: 100%; height: 36px;
      background: #fff; border: 1px solid var(--line);
      border-radius: 6px; padding: 0 10px;
      font-size: 13px; color: var(--ink); font-family: 'Inter', sans-serif;
      outline: none; transition: box-shadow .15s;
      appearance: none;
    }
    textarea.input-admin { height: auto; padding: 8px 10px; }
    select.input-admin { cursor: pointer; }
    .input-admin::placeholder { color: var(--mute); }
    .input-admin:focus {
      border-color: var(--line-2);
      box-shadow: 0 0 0 3px rgba(255,214,10,.30);
    }

    /* ── Placeholder full card ─────────────────────────────────── */
    .placeholder-card {
      background: #fff; border: 1px solid var(--line);
      border-radius: 10px; padding: 52px 24px;
      text-align: center; color: var(--mute);
    }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #D9D5C7; border-radius: 10px;
      border: 2px solid transparent; background-clip: content-box;
    }
  </style>
</head>

<body>
  <!-- ── Sidebar (offcanvas on mobile, fixed on desktop) ─────── -->
  <aside class="offcanvas offcanvas-start" tabindex="-1" id="appSidebar">

    <!-- Brand -->
    <div class="sb-brand">
      <div class="sb-mark">M</div>
      <div>
        <div class="sb-product">Panel Matys</div>
        <div class="sb-version">Admin v1</div>
      </div>
    </div>

    <!-- CATÁLOGO -->
    <div class="sb-section-label">Catálogo</div>
    <a href="{% url 'gestion_dashboard' %}"
       class="sb-nav-item {% if active_nav == 'dashboard' %}active{% endif %}">
      <i class="bi bi-grid"></i> Vista general
    </a>
    <a href="{% url 'gestion_categorias' %}"
       class="sb-nav-item {% if active_nav == 'categorias' %}active{% endif %}">
      <i class="bi bi-list-ul"></i> Categorías
    </a>

    <!-- TIENDA -->
    <div class="sb-section-label">Tienda</div>
    <a href="{% url 'gestion_inicio' %}"
       class="sb-nav-item {% if active_nav == 'inicio_admin' %}active{% endif %}">
      <i class="bi bi-house"></i> Inicio
    </a>

    <!-- User block -->
    <div class="sb-user">
      <div class="sb-avatar"><i class="bi bi-person"></i></div>
      <div>
        <div class="sb-user-name">{{ request.user.username }}</div>
        <div class="sb-user-role">{% if request.user.is_superuser %}Superusuario{% else %}Staff{% endif %}</div>
      </div>
      <a href="{% url 'gestion_logout' %}" class="sb-logout" title="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </div>

  </aside>

  <!-- ── Main wrapper ─────────────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <!-- Mobile hamburger -->
      <button class="topbar-menu-btn d-md-none border-0"
              data-bs-toggle="offcanvas" data-bs-target="#appSidebar"
              aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>

      <!-- Breadcrumb -->
      <nav class="topbar-breadcrumb">
        <span>Panel Matys</span>
        <span class="sep">/</span>
        <span class="current">{% block breadcrumb %}Inicio{% endblock %}</span>
      </nav>

      <div class="topbar-spacer"></div>

      <!-- Search -->
      <div class="topbar-search">
        <i class="bi bi-search" style="font-size:13px;"></i>
        <input type="search" placeholder="Buscar…">
      </div>

      <!-- Icon buttons -->
      <a href="{% url 'inicio' %}" target="_blank"
         class="topbar-icon-btn" title="Ver sitio público">
        <i class="bi bi-box-arrow-up-right"></i>
      </a>
      <a href="{% url 'gestion_logout' %}"
         class="topbar-icon-btn d-none d-md-flex" title="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </header>

    <!-- Page content -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

  </div><!-- /main-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
