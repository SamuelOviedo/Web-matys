databases:
  - name: matys-db
    databaseName: matys
    user: matys
    plan: free

services:
  - type: web
    name: web-matys
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd web_maty && gunicorn web_maty.wsgi:application"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: matys-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"
