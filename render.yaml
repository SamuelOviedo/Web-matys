databases:
  - name: matys-db
    databaseName: matys
    user: matys
    plan: free

services:
  - type: web
    name: web-matys
    runtime: python
    buildCommand: "cd web_maty && bash ../build.sh"
    startCommand: "cd web_maty && python create_admin.py && gunicorn web_maty.wsgi:application --bind 0.0.0.0:$PORT"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: matys-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: AI_DAILY_TOKEN_LIMIT
        value: "10000"
